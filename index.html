<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Compartida: Carlos, Laura y Samuel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-red: #d32f2f;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            /* Colores de Usuario */
            --color-carlos: #1976D2;
            --color-laura: #C2185B;
            --color-samuel: #2E7D32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        
        /* Sidebar */
        .sidebar { background-color: var(--card-bg); padding: 25px; border-radius: 12px; border-left: 5px solid var(--accent-red); position: sticky; top: 20px; height: fit-content; }
        .sidebar h2 { margin-bottom: 20px; color: var(--accent-red); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: var(--text-muted); font-weight: 600; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        
        /* Selección de Usuarios */
        .user-selection { display: flex; gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .user-checkbox { flex: 1; position: relative; }
        .user-checkbox input { position: absolute; opacity: 0; cursor: pointer; }
        .user-checkbox label { display: block; text-align: center; padding: 8px 5px; background: #ffffff; border-radius: 4px; cursor: pointer; border: 1px solid #eee; margin-bottom: 0; font-size: 0.85em; transition: 0.2s; }
        .user-checkbox input:checked + label[for="chk-carlos"] { background: #E3F2FD; color: var(--color-carlos); border-color: var(--color-carlos); font-weight: bold; }
        .user-checkbox input:checked + label[for="chk-laura"] { background: #FCE4EC; color: var(--color-laura); border-color: var(--color-laura); font-weight: bold; }
        .user-checkbox input:checked + label[for="chk-samuel"] { background: #E8F5E9; color: var(--color-samuel); border-color: var(--color-samuel); font-weight: bold; }

        /* Gestión de Tipos */
        .type-selector-group { display: flex; gap: 8px; align-items: center; }
        #activeTypeColor { width: 42px; height: 42px; border-radius: 6px; border: 1px solid #ccc; background-color: #ddd; flex-shrink: 0; }
        .btn-control-type { border: 1px solid #ccc; color: #555; width: 42px; height: 42px; border-radius: 6px; cursor: pointer; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; }
        #newTypeForm { margin-top: 10px; background: #f5f5f5; padding: 10px; border-radius: 6px; border: 1px solid #ddd; display: none; }
        
        button.btn-primary { width: 100%; padding: 12px; background-color: var(--accent-red); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button.btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Calendario */
        .calendar-container { background-color: var(--card-bg); border-radius: 12px; padding: 20px; min-height: 600px; position: relative; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day-name { text-align: center; font-weight: bold; color: var(--accent-red); padding-bottom: 10px; }
        .calendar-day { background: #fff; min-height: 120px; padding: 10px; border-radius: 6px; border: 1px solid #eee; cursor: pointer; }
        .calendar-day.today { background: #fff5f5; border: 1px solid var(--accent-red); }
        .day-number { font-weight: bold; color: #444; display: block; margin-bottom: 5px; pointer-events: none; }
        
        .event-chip { font-size: 0.75em; padding: 4px 6px; margin-bottom: 4px; border-radius: 4px; color: white; cursor: pointer; border-left: 5px solid rgba(0,0,0,0.2); display:flex; justify-content:space-between; }
        .event-chip i { font-size: 0.8em; opacity: 0.7; }

        /* Modal y Loader */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 400px; border-top: 5px solid var(--accent-red); position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #999; }
        .btn-delete { background-color: #ffebee; color: #d32f2f; border: 1px solid #ffcdd2; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        #loadingOverlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; font-weight: bold; color: var(--accent-red); z-index: 10; border-radius: 12px; }
        
        .legend { display: flex; gap: 15px; margin-top: 20px; justify-content: center; font-size: 0.9em; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display:inline-block; margin-right:5px; }
        .bg-carlos { background-color: var(--color-carlos); }
        .bg-laura { background-color: var(--color-laura); }
        .bg-samuel { background-color: var(--color-samuel); }
        
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .sidebar { position: static; } }
    </style>
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <h2><i class="fas fa-plus-circle"></i> Nueva Pendiente</h2>
            <form id="activityForm">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="title" placeholder="Ej: Pagar facturas" required>
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Asignado a:</label>
                    <div class="user-selection">
                        <div class="user-checkbox"><input type="checkbox" id="chk-carlos" value="carlos"><label for="chk-carlos">Carlos</label></div>
                        <div class="user-checkbox"><input type="checkbox" id="chk-laura" value="laura"><label for="chk-laura">Laura</label></div>
                        <div class="user-checkbox"><input type="checkbox" id="chk-samuel" value="samuel"><label for="chk-samuel">Samuel</label></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tipo de Actividad</label>
                    <div class="type-selector-group">
                        <div id="activeTypeColor"></div>
                        <select id="type" required style="flex: 1;" onchange="updateTypePreview()"></select>
                        <button type="button" class="btn-control-type" onclick="toggleNewTypeForm()"><i class="fas fa-plus"></i></button>
                        <button type="button" class="btn-control-type" onclick="deleteSelectedType()"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div id="newTypeForm">
                        <input type="text" id="newTypeName" placeholder="Nombre" style="width:100%; margin-bottom:5px;">
                        <input type="color" id="newTypeColor" value="#ff9800" style="width:100%; margin-bottom:5px;">
                        <button type="button" onclick="saveNewType()" style="width:100%;">Guardar</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="description" rows="2" placeholder="Detalles..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Agregar al Calendario</button>
            </form>
            <div class="legend">
                <div><span class="dot bg-carlos"></span>Carlos</div><div><span class="dot bg-laura"></span>Laura</div><div><span class="dot bg-samuel"></span>Samuel</div>
            </div>
        </aside>

        <main class="calendar-container">
            <div id="loadingOverlay"><i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i> Cargando...</div>
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">Anterior</button>
                <h2 id="currentMonthYear"></h2>
                <button onclick="changeMonth(1)">Siguiente</button>
            </div>
            <div class="days-grid">
                <div class="day-name">Dom</div><div class="day-name">Lun</div><div class="day-name">Mar</div><div class="day-name">Mié</div><div class="day-name">Jue</div><div class="day-name">Vie</div><div class="day-name">Sáb</div>
            </div>
            <div id="calendarGrid" class="days-grid"></div>
        </main>
    </div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p><strong>Fecha:</strong> <span id="modalDateDisplay"></span></p>
            <p><strong>Asignados:</strong> <span id="modalUser" style="text-transform: capitalize;"></span></p>
            <p><strong>Tipo:</strong> <span id="modalType" style="padding: 2px 8px; border-radius: 4px; color: white;"></span></p>
            <p id="modalDesc" style="margin-top: 15px; color: #555; border-top: 1px solid #eee; padding-top: 10px;"></p>
            <div style="margin-top:20px; text-align:right;">
                <button class="btn-delete" onclick="deleteCurrentEvent()">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        const USER_COLORS = { 'carlos': '#1976D2', 'laura': '#C2185B', 'samuel': '#2E7D32' };
        // URL de tu Script de Google
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCqWA97pVq8xufdC_OmT8FtYInJarjxMjHYemuCLfTwSNg37yka7g6BWiLiiuGwoAr/exec";

        const DEFAULT_TYPES_DATA = [
            { id: 'general', name: 'General', color: '#607D8B' },
            { id: 'cumpleanos', name: 'Cumpleaños', color: '#9C27B0' },
            { id: 'pago', name: 'Pago', color: '#D32F2F' }
        ];

        let currentDate = new Date();
        
        // --- ESTRATEGIA NUEVA: DOS LISTAS SEPARADAS ---
        let cloudEvents = []; // Solo lo que llega de Google
        let pendingEvents = JSON.parse(localStorage.getItem('pendingEvents')) || []; // Lo que creamos localmente y Google aún no confirma
        
        let loadedTypes = JSON.parse(localStorage.getItem('activityTypes'));
        let activityTypes = (loadedTypes && loadedTypes.length > 0) ? loadedTypes : DEFAULT_TYPES_DATA;
        let currentEventId = null;

        let calendarGrid, currentMonthYear, typeSelect, newTypeForm, activeTypeColor, modal, loadingOverlay;

        window.onload = () => {
            calendarGrid = document.getElementById('calendarGrid');
            currentMonthYear = document.getElementById('currentMonthYear');
            typeSelect = document.getElementById('type');
            newTypeForm = document.getElementById('newTypeForm');
            activeTypeColor = document.getElementById('activeTypeColor');
            modal = document.getElementById('eventModal');
            loadingOverlay = document.getElementById('loadingOverlay');

            renderTypes();
            renderCalendar();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            
            // Cargar datos al iniciar
            cargarDeNube();
        };

        // --- FUNCIÓN BLINDADA CONTRA DESAPARICIONES ---
        function cargarDeNube() {
             if(cloudEvents.length === 0 && pendingEvents.length === 0) loadingOverlay.style.display = 'flex';

             fetch(GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                if(Array.isArray(data)) {
                    cloudEvents = data; // Actualizamos la lista oficial de la nube
                    
                    // LIMPIEZA: Si un evento pendiente YA llegó en la lista de la nube, lo borramos de pendientes
                    const idsNube = new Set(cloudEvents.map(e => e.id.toString()));
                    pendingEvents = pendingEvents.filter(e => !idsNube.has(e.id.toString()));
                    
                    // Guardamos el estado limpio de pendientes
                    localStorage.setItem('pendingEvents', JSON.stringify(pendingEvents));
                    
                    renderCalendar(); 
                }
                loadingOverlay.style.display = 'none';
            })
            .catch(error => {
                console.error("Error:", error);
                loadingOverlay.style.display = 'none';
            });
        }

        // --- RENDERIZADO: SUMA LAS DOS LISTAS ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            currentMonthYear.innerText = new Date(year, month).toLocaleString('es-ES', { month: 'long', year: 'numeric' });
            
            // COMBINAMOS AMBAS LISTAS PARA MOSTRAR
            const allEvents = [...cloudEvents, ...pendingEvents];

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            calendarGrid.innerHTML = '';

            for(let i=0; i<firstDay; i++) {
                calendarGrid.appendChild(document.createElement('div')); 
            }

            for(let i=1; i<=daysInMonth; i++) {
                let day = document.createElement('div');
                day.className = 'calendar-day';
                let today = new Date();
                if(i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    day.classList.add('today');
                }
                
                day.innerHTML = `<span class="day-number">${i}</span>`;
                let dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                
                day.onclick = (e) => {
                    if(e.target.closest('.event-chip')) return;
                    document.getElementById('date').value = dateStr;
                };

                // Filtramos de la lista combinada
                allEvents.filter(e => e.date === dateStr).forEach(evt => {
                    let chip = document.createElement('div');
                    chip.className = 'event-chip';
                    
                    let typeObj = activityTypes.find(t => t.id === evt.type) || activityTypes[0];
                    chip.style.backgroundColor = typeObj.color;
                    
                    let users = evt.users || [];
                    if(users.length > 1) {
                         let gradient = users.map(u => USER_COLORS[u] || '#ccc').join(', ');
                         chip.style.borderImageSource = `linear-gradient(to bottom, ${gradient})`;
                         chip.style.borderImageSlice = 1;
                    } else if (users.length === 1) {
                        chip.style.borderLeftColor = USER_COLORS[users[0]] || '#ccc';
                    }

                    // Icono de reloj si es pendiente (local)
                    let icon = pendingEvents.find(p => p.id == evt.id) ? '<i class="fas fa-clock"></i>' : '';
                    
                    chip.innerHTML = `<span>${evt.title}</span> ${icon}`;
                    chip.onclick = () => openModal(evt, typeObj);
                    day.appendChild(chip);
                });
                calendarGrid.appendChild(day);
            }
        }

        // --- CREAR EVENTO: GUARDA EN PENDIENTES ---
        document.getElementById('activityForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let users = [];
            if(document.getElementById('chk-carlos').checked) users.push('carlos');
            if(document.getElementById('chk-laura').checked) users.push('laura');
            if(document.getElementById('chk-samuel').checked) users.push('samuel');
            
            if(users.length === 0) return alert("Selecciona usuario");

            // ID único basado en texto para evitar confusiones
            let newId = "local_" + Date.now();

            let evt = {
                id: newId,
                title: document.getElementById('title').value,
                date: document.getElementById('date').value,
                users: users,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value
            };

            // 1. Agregamos a la lista de pendientes
            pendingEvents.push(evt);
            localStorage.setItem('pendingEvents', JSON.stringify(pendingEvents));
            
            // 2. Mostramos inmediatamente
            renderCalendar();
            
            // 3. Enviamos a la nube
            enviarAScript(evt); 
        });

        function enviarAScript(data) {
            let btn = document.querySelector('button[type="submit"]');
            let txt = btn.innerText;
            btn.innerText = "Guardando...";
            btn.disabled = true;

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', 
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => {
                btn.innerText = "¡Enviado!";
                setTimeout(() => { btn.innerText = txt; btn.disabled = false; }, 2000);
                // Nota: No recargamos aquí. Dejamos que el auto-update lo haga.
                // Cuando el auto-update traiga este evento desde Google, lo borrará de pendingEvents.
            }).catch(e => {
                console.error(e);
                alert("Error de conexión (se mantiene en local).");
                btn.innerText = txt; btn.disabled = false;
            });
        }

        function deleteCurrentEvent() {
            if(confirm("¿Eliminar este evento?")) {
                // Solo podemos borrar fácilmente los locales
                // Para borrar de la nube se requiere lógica backend compleja, por ahora solo ocultamos local
                pendingEvents = pendingEvents.filter(e => e.id !== currentEventId);
                cloudEvents = cloudEvents.filter(e => e.id !== currentEventId); // Solo visual
                
                localStorage.setItem('pendingEvents', JSON.stringify(pendingEvents));
                renderCalendar();
                closeModal();
                alert("Evento eliminado de la vista.");
            }
        }

        // --- Utilidades ---
        function changeMonth(d) {
            currentDate.setMonth(currentDate.getMonth() + d);
            renderCalendar();
        }
        function renderTypes() {
            const currentSelection = typeSelect.value;
            typeSelect.innerHTML = '';
            activityTypes.forEach(type => {
                let opt = document.createElement('option');
                opt.value = type.id;
                opt.innerText = type.name;
                typeSelect.appendChild(opt);
            });
            if(activityTypes.length > 0) typeSelect.value = activityTypes[0].id;
            updateTypePreview();
        }
        function updateTypePreview() {
            const t = activityTypes.find(x => x.id === typeSelect.value);
            if(t) activeTypeColor.style.backgroundColor = t.color;
        }
        function toggleNewTypeForm() { newTypeForm.style.display = newTypeForm.style.display === 'block' ? 'none' : 'block'; }
        function saveNewType() {
            const name = document.getElementById('newTypeName').value;
            const color = document.getElementById('newTypeColor').value;
            if(!name) return;
            const id = name.toLowerCase().replace(/\s+/g,'_');
            activityTypes.push({id, name, color});
            localStorage.setItem('activityTypes', JSON.stringify(activityTypes));
            renderTypes();
            typeSelect.value = id;
            updateTypePreview();
            toggleNewTypeForm();
        }
        function deleteSelectedType() {
            const id = typeSelect.value;
            if(!id) return;
            if(activityTypes.length <= 1) return alert("Debe haber al menos un tipo.");
            if(confirm("¿Borrar tipo?")) {
                activityTypes = activityTypes.filter(t => t.id !== id);
                localStorage.setItem('activityTypes', JSON.stringify(activityTypes));
                renderTypes();
            }
        }
        function openModal(evt, typeObj) {
            currentEventId = evt.id;
            document.getElementById('modalTitle').innerText = evt.title;
            document.getElementById('modalDateDisplay').innerText = evt.date;
            document.getElementById('modalUser').innerText = (evt.users || []).join(', ');
            let tInfo = document.getElementById('modalType');
            tInfo.innerText = typeObj.name;
            tInfo.style.backgroundColor = typeObj.color;
            document.getElementById('modalDesc').innerText = evt.description || "";
            // Indicar si es pendiente
            if(pendingEvents.find(p => p.id == evt.id)) {
                 document.getElementById('modalDesc').innerText += "\n\n(⏳ Sincronizando con la nube...)";
            }
            modal.style.display = 'flex';
        }
        function closeModal() { modal.style.display = 'none'; }
        window.onclick = (e) => { if(e.target == modal) closeModal(); }

        // --- AUTO-ACTUALIZACIÓN ---
        setInterval(() => {
            console.log("Sincronizando...");
            cargarDeNube();
        }, 30000);

    </script>
</body>
</html>
